
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | TeachSense AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101a36, #315bd6);
        }

        .signup-box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 32px;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #243d78;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #68718a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
            color: #27334d;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd3e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #315bd6;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #315bd6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2448b5;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #68718a;
        }

        a {
            color: #315bd6;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="signup-box">
        <div class="logo">🎓</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join TeachSense AI and start teaching smarter.
        </p>

        <form action="/signup" method="POST">
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Create Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="At least 8 characters"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login Here</a>
        </p>
    </div>
</body>
</html>
