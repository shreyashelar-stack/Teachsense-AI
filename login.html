
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TeachSense AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101a36, #315bd6);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 32px;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #243d78;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #68718a;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #27334d;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd3e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #315bd6;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #315bd6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2448b5;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            color: #68718a;
        }

        a {
            color: #315bd6;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #8991a4;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="logo">🎓</div>

        <h1>TeachSense AI</h1>

        <p class="subtitle">
            Welcome back! Log in to your teaching assistant.
        </p>

        <form action="/login" method="POST">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="/signup">Create Account</a>
        </p>

        <div class="footer">
            AI-powered learning and teaching support
        </div>
    </div>
</body>
</html>
